name: Deploy CD
run-name: ${{ github.actor }} is running Deploy CD (TEST)

on:
  push:
    branches:
      - deploytest
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: 'PR number to comment on (for testing)'
        required: true
      scenario:
        description: 'Test scenario'
        required: true
        type: choice
        default: 'all_packages'
        options:
          - all_packages
          - sub_packages_only
          - no_packages

jobs:
  publish-npm:
    name: Publish - NPM (MOCK)
    runs-on: ubuntu-latest

    outputs:
      package_versions: ${{ steps.increment.outputs.package_versions }}

    steps:
      - name: Mock Increment Package Versions
        id: increment
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'all_packages' }}"
          echo "Running scenario: $SCENARIO"
          echo "package_versions<<EOF" >> $GITHUB_OUTPUT
          if [ "$SCENARIO" = "all_packages" ]; then
            echo "package: @webex/internal-plugin-device => 3.5.0-next.4" >> $GITHUB_OUTPUT
            echo "package: @webex/internal-plugin-mercury => 3.5.0-next.4" >> $GITHUB_OUTPUT
            echo "package: @webex/webex-core => 3.5.0-next.4" >> $GITHUB_OUTPUT
            echo "package: webex => 3.5.0-next.4" >> $GITHUB_OUTPUT
          elif [ "$SCENARIO" = "sub_packages_only" ]; then
            echo "package: @webex/internal-plugin-device => 3.4.0-next.7" >> $GITHUB_OUTPUT
            echo "package: @webex/internal-plugin-mercury => 3.3.0-next.2" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Mock increment complete"

  publish-tag:
    name: Publish - Tags (MOCK)
    needs: [publish-npm]
    runs-on: ubuntu-latest

    steps:
      - name: Mock Tag Publish
        run: echo "Mock tag publish complete"

  publish-documentation:
    name: Publish - Documentation (MOCK)
    needs: [publish-npm]
    runs-on: ubuntu-latest

    steps:
      - name: Mock Documentation Publish
        run: echo "Mock documentation publish complete"

  comment-on-pr:
    name: Comment on Released PRs
    needs: [publish-npm, publish-tag, publish-documentation]
    runs-on: ubuntu-latest

    steps:
      - name: Get PR Number
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const manualPrNumber = '${{ github.event.inputs.test_pr_number }}';
            if (manualPrNumber) {
              core.setOutput('pr_number', manualPrNumber);
              console.log(`Using manual PR number: ${manualPrNumber}`);
              return;
            }

            const deploySha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: deploySha
              });
              const mergedPR = prs.data.find(pr => pr.merged_at);
              if (mergedPR) {
                core.setOutput('pr_number', String(mergedPR.number));
                return;
              }
            } catch (error) {
              console.log(`Failed to discover PR from commit: ${error.message}`);
            }
            core.setOutput('pr_number', '');

      - name: Post Release Comment on PR
        if: steps.get-pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.get-pr.outputs.pr_number }}');

            const raw = `${{ needs.publish-npm.outputs.package_versions }}`;
            const packageVersions = {};
            for (const line of raw.split('\n')) {
              const match = line.match(/^package:\s+(.+?)\s+=>\s+(.+)$/);
              if (match) packageVersions[match[1].trim()] = match[2].trim();
            }
            const packageEntries = Object.entries(packageVersions);
            const version = packageVersions['webex'] ? `v${packageVersions['webex']}` : '';

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoUrl = `https://github.com/${owner}/${repo}`;
            const hasPackages = packageEntries.length > 0;

            console.log(`PR: #${prNumber}`);
            console.log(`Packages: ${JSON.stringify(packageVersions)}`);
            console.log(`Version: ${version}`);
            console.log(`Has packages: ${hasPackages}`);

            let commentBody;

            if (hasPackages) {
              const primaryPackage = packageVersions['webex']
                ? 'webex'
                : packageEntries.filter(([p]) => p !== 'webex' && p !== 'webex-node').map(([p]) => p)[0] || packageEntries[0][0];
              const primaryVersion = packageVersions[primaryPackage];
              const stableVersion = primaryVersion.replace(/-next\..*/, '').replace(/-[a-z]*\..*/, '');

              const changelogUrl = new URL('https://web-sdk.webex.com/changelog/');
              if (stableVersion) {
                changelogUrl.searchParams.set('stable_version', stableVersion);
              }
              changelogUrl.searchParams.set('package', primaryPackage);
              changelogUrl.searchParams.set('version', primaryVersion);

              const releaseLine = version
                ? `| **Released in:** [\`${version}\`](${repoUrl}/releases/tag/${version}) |`
                : '';

              const rows = packageEntries
                .sort(([a], [b]) => {
                  if (a === 'webex') return -1;
                  if (b === 'webex') return 1;
                  if (a === primaryPackage) return -1;
                  if (b === primaryPackage) return 1;
                  return a.localeCompare(b);
                })
                .map(([pkg, ver]) => `| \`${pkg}\` | \`${ver}\` |`)
                .join('\n');

              const packagesTable = [
                '',
                '| Packages Updated | Version |',
                '|---------|---------|',
                rows,
                ''
              ].join('\n');

              commentBody = [
                '| :tada: Your changes are now available! |',
                '|---|',
                releaseLine,
                `| :book: **[View full changelog →](${changelogUrl})** |`,
                packagesTable,
                'Thank you for your contribution!',
                '',
                `_:robot: This is an automated message. For questions, please refer to the [documentation](${repoUrl}#readme)._`
              ].filter(Boolean).join('\n');
            } else {
              commentBody = [
                ':white_check_mark: **Your changes have been merged!**',
                '',
                'Thank you for your contribution!',
                '',
                `_:robot: This is an automated message. For questions, please refer to the [documentation](${repoUrl}#readme)._`
              ].join('\n');
            }

            try {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

              const existingComments = await github.rest.issues.listComments({
                owner, repo,
                issue_number: prNumber,
                per_page: 200
              });

              const detailedComment = existingComments.data.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Your changes are now available')
              );
              const mergedComment = existingComments.data.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Your changes have been merged')
              );

              if (detailedComment) {
                console.log('Detailed comment already exists, skipping');
                return;
              }
              if (!hasPackages && mergedComment) {
                console.log('Merged comment already exists and no packages, skipping');
                return;
              }

              if (mergedComment && hasPackages) {
                await github.rest.issues.updateComment({
                  owner, repo,
                  comment_id: mergedComment.id,
                  body: commentBody
                });
                console.log(`Updated existing comment on PR #${prNumber}`);
              } else {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: prNumber,
                  body: commentBody
                });
                console.log(`Created new comment on PR #${prNumber}`);
              }
            } catch (error) {
              core.warning(`Failed to comment on PR #${prNumber}: ${error.message}`);
            }
